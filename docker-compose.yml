version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pedidos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos_soto
    ports:
      - "5432:5432"
    volumes:
      - pedidos_db_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos_soto"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: pedidos-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  pedidos_db_data:
